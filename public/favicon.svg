<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#12314f" />
      <stop offset="100%" stop-color="#061220" />
    </radialGradient>
    <linearGradient id="treeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#29b864" />
      <stop offset="100%" stop-color="#116634" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff3b0" />
      <stop offset="50%" stop-color="#ffd700" />
      <stop offset="100%" stop-color="#d49617" />
    </linearGradient>
  </defs>

  <!-- Midnight Arctic Badge with Gold Rim -->
  <circle cx="32" cy="32" r="30" fill="url(#bgGrad)" stroke="#f3c868" stroke-width="2.5" />

  <!-- Snow Mound at Tree Base -->
  <ellipse cx="32" cy="54" rx="18" ry="4.5" fill="#ebf4ff" />

  <!-- Trunk -->
  <rect x="28.5" y="47" width="7" height="7" rx="1.5" fill="#6b3919" />

  <!-- Layered Snowy Pine Tree -->
  <path d="M32 14 L50 38 L42 38 L53 49 L11 49 L22 38 L14 38 Z" fill="url(#treeGrad)" stroke="#0b4723" stroke-width="1.5" stroke-linejoin="round" />

  <!-- Garland Ribbon -->
  <path d="M22 31 Q32 36 42 31" fill="none" stroke="#ffd97d" stroke-width="2" stroke-linecap="round" />
  <path d="M17 42 Q32 48 47 42" fill="none" stroke="#ffd97d" stroke-width="2" stroke-linecap="round" />

  <!-- Ornaments -->
  <circle cx="27" cy="29" r="3" fill="#ff2b4a" stroke="#fff3d6" stroke-width="0.8" />
  <circle cx="37" cy="34" r="3" fill="#ffd700" stroke="#fff3d6" stroke-width="0.8" />
  <circle cx="24" cy="43" r="3.2" fill="#00e5ff" stroke="#fff3d6" stroke-width="0.8" />
  <circle cx="33" cy="41" r="3.2" fill="#ff2b4a" stroke="#fff3d6" stroke-width="0.8" />
  <circle cx="41" cy="44" r="3" fill="#ffd700" stroke="#fff3d6" stroke-width="0.8" />

  <!-- Golden Star Topper -->
  <polygon
    points="32,5 34.5,10.5 40.5,11 35.8,14.8 37.3,20.5 32,17.2 26.7,20.5 28.2,14.8 23.5,11 29.5,10.5"
    fill="url(#goldGrad)"
    stroke="#8a5a08"
    stroke-width="1"
    stroke-linejoin="round"
  />
</svg>
